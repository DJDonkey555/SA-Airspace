<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>South Africa Airspace (ATNS)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<style>
  html,body,#map{height:100%;margin:0}
  .ap{background:none;border:none;box-shadow:none;font:bold 11px sans-serif;color:#000;padding:0 0 0 2px;text-shadow:0 0 2px #fff,0 0 2px #fff}
  .ap:before{display:none}
  .leaflet-popup-content{font:13px/1.4 sans-serif;margin:10px 12px;max-height:340px;overflow:auto}
  #status{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.95);padding:6px 12px;border-radius:4px;font:13px sans-serif;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.2);max-width:380px}
  #legend{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,.93);padding:6px 10px;border-radius:4px;font:12px/1.5 sans-serif;z-index:1000;box-shadow:0 1px 4px rgba(0,0,0,.2)}
  #legend b{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:middle;border-radius:2px}
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Loading…</div>
<div id="legend"></div>
<script>
// =====================================================================
// CHANGE THIS if your KMZ file has a different name
// =====================================================================
const KMZ_FILENAME = 'RSA DATA -01OCT2026.kmz';
// =====================================================================

const statusEl = document.getElementById('status');
const setStatus = (txt, colour='#111') => { statusEl.textContent = txt; statusEl.style.color = colour; };

// ---------------------------------------------------------------------
// Map
// ---------------------------------------------------------------------
const map = L.map('map', { maxZoom: 16 });
const base = {
  'CARTO light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',
                    {attribution:'© OpenStreetMap © CARTO', maxZoom:16}),
  'Light grey (Esri)': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
                    {attribution:'Esri', maxNativeZoom:16, maxZoom:16}),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
                    {attribution:'© OpenStreetMap', maxZoom:16})
};
base['CARTO light'].addTo(map);
map.fitBounds([[-35, 16], [-22, 33]]);

// ---------------------------------------------------------------------
// Airports (all 66 from the AIP)
// ---------------------------------------------------------------------
const AIRPORTS = [
  ['FAAB',-28.57331,16.53433],['FABB',-26.24289,28.30078],['FABE',-32.89722,27.27917],
  ['FABL',-29.09673,26.30064],['FABM',-28.24861,28.33611],['FABW',-32.20833,22.93889],
  ['FACF',-34.18774,24.83051],['FACO',-29.93320,22.26574],['FACT',-33.97137,18.60429],
  ['FAEL',-33.03560,27.82316],['FAGC',-26.07420,28.13170],['FAGG',-34.00568,22.37596],
  ['FAGM',-26.24250,28.15120],['FAGR',-32.19116,24.53837],['FAGY',-29.11985,30.58722],
  ['FAHG',-26.50500,28.39400],['FAHL',-28.02000,32.28000],['FAHS',-24.35889,31.04750],
  ['FAKM',-28.80478,24.76403],['FAKN',-25.39103,31.09928],['FAKR',-26.08029,27.72452],
  ['FALA',-25.93969,27.92557],['FALE',-29.61177,31.11931],['FALM',-23.15945,29.70150],
  ['FALW',-32.96881,18.16526],['FALY',-28.57991,29.75274],['FAMD',-24.81378,31.54455],
  ['FAMG',-30.85737,30.34303],['FAMM',-25.80745,25.54447],['FAMN',-25.47333,31.56556],
  ['FAMO',-34.15729,22.06194],['FANC',-27.77278,29.97639],['FAOB',-34.55812,20.24856],
  ['FAOH',-33.60000,22.18333],['FAOR',-26.13703,28.24287],['FAPA',-33.55927,26.87797],
  ['FAPE',-33.99001,25.61028],['FAPG',-34.08816,23.32862],['FAPH',-23.93664,31.15510],
  ['FAPI',-23.92694,29.48436],['FAPM',-29.64679,30.39777],['FAPN',-25.33604,27.17163],
  ['FAPP',-23.84965,29.45649],['FAPS',-26.66829,27.08333],['FARB',-28.74114,32.09338],
  ['FASC',-26.52104,29.17222],['FASK',-25.80894,28.16697],['FASS',-27.64995,23.00305],
  ['FASZ',-24.96133,31.58882],['FATF',-28.26667,23.00000],['FATT',-26.78051,29.33909],
  ['FATW',-27.20313,22.48083],['FATZ',-23.83000,30.31667],['FAUL',-28.31947,31.41694],
  ['FAUP',-28.40130,21.25913],['FAUS',-24.78225,31.35417],['FAUT',-31.54645,28.67532],
  ['FAVG',-29.77083,31.06028],['FAVM',-22.44811,29.33778],['FAWB',-25.65531,28.22134],
  ['FAWI',-25.83378,29.19263],['FAWK',-25.82826,28.22275],['FAWN',-33.76972,18.74000],
  ['FAYP',-33.90099,18.49749]
];
AIRPORTS.forEach(([id, la, lo]) =>
  L.circleMarker([la, lo], {radius:4, color:'#fff', weight:1.5,
    fillColor:'#000', fillOpacity:1, interactive:false})
   .bindTooltip(id, {permanent:true, direction:'right', className:'ap', offset:[4,0]})
   .addTo(map));

// ---------------------------------------------------------------------
// Colour-code an airspace based on its name
// ---------------------------------------------------------------------
function styleFor(feature) {
  const name = (feature.properties?.name || feature.properties?.Name || '').toUpperCase();
  let colour = '#2563eb';                                          // default blue
  if (/^FAP\b|PROHIBITED/.test(name))        colour = '#991b1b';   // FAP dark red
  else if (/^FAR\b|RESTRICTED/.test(name))   colour = '#dc2626';   // FAR red
  else if (/^FAD\b|DANGER/.test(name))       colour = '#d97706';   // FAD amber
  else if (/SRA|SPECIAL RULE/.test(name))    colour = '#7c3aed';   // SRA purple
  else if (/CTR|CONTROL ZONE/.test(name))    colour = '#2563eb';   // CTR blue
  else if (/TMA|TERMINAL/.test(name))        colour = '#8b5cf6';   // TMA violet
  else if (/CTA|CONTROL AREA/.test(name))    colour = '#6366f1';   // CTA indigo
  else if (/ATZ|TRAFFIC ZONE/.test(name))    colour = '#0891b2';   // ATZ cyan
  else if (/FIR|UIR|FLIGHT INFO/.test(name)) colour = '#475569';   // FIR grey
  return { color: colour, weight: 1.5, fillColor: colour, fillOpacity: 0.06 };
}

// ---------------------------------------------------------------------
// Popup content
// ---------------------------------------------------------------------
function popupFor(feature) {
  const p = feature.properties || {};
  const name = p.name || p.Name || p.NAME || 'Unnamed airspace';
  let html = `<b style="font-size:14px">${name}</b><br><br>`;
  for (const [k, v] of Object.entries(p)) {
    if (v === '' || v == null) continue;
    if (/^(name|Name|NAME|description|Description)$/.test(k)) continue;
    html += `<span style="color:#666">${k}:</span> ${v}<br>`;
  }
  if (p.description || p.Description) {
    html += `<br><div style="border-top:1px solid #ddd;padding-top:6px">${p.description || p.Description}</div>`;
  }
  return html;
}

// ---------------------------------------------------------------------
// Load the KMZ
// ---------------------------------------------------------------------
async function loadKMZ() {
  try {
    setStatus('Fetching KMZ…');
    const response = await fetch(KMZ_FILENAME);
    if (!response.ok) throw new Error(`HTTP ${response.status}. Is "${KMZ_FILENAME}" in the same folder?`);
    const blob = await response.blob();

    setStatus('Unzipping…');
    const zip = await JSZip.loadAsync(blob);

    // Find ALL .kml files inside the KMZ (there can be several)
    const kmlFiles = [];
    for (const filename in zip.files) {
      const f = zip.files[filename];
      if (!f.dir && filename.toLowerCase().endsWith('.kml')) {
        kmlFiles.push(filename);
      }
    }
    if (!kmlFiles.length) throw new Error('No .kml file found inside the KMZ.');
    console.log('KML files inside KMZ:', kmlFiles);

    // Parse every KML and merge into one FeatureCollection
    const allFeatures = [];
    for (const filename of kmlFiles) {
      setStatus(`Parsing ${filename}…`);
      const kmlText = await zip.files[filename].async('text');
      const kml = new DOMParser().parseFromString(kmlText, 'text/xml');
      if (kml.querySelector('parsererror')) {
        console.warn(`Skipping ${filename} — parse error`);
        continue;
      }
      const gj = toGeoJSON.kml(kml);
      if (gj.features) allFeatures.push(...gj.features);
    }

    setStatus(`Rendering ${allFeatures.length} airspaces…`);
    console.log(`Total features: ${allFeatures.length}`);
    console.log('Sample feature properties:', allFeatures[0]?.properties);

    L.geoJSON({ type: 'FeatureCollection', features: allFeatures }, {
      style: styleFor,
      onEachFeature: (f, layer) => {
        layer.bindPopup(popupFor(f), { maxWidth: 380 });
        layer.on('mouseover', () => layer.setStyle({ weight: 3, fillOpacity: 0.15 }));
        layer.on('mouseout',  () => layer.setStyle(styleFor(f)));
      }
    }).addTo(map);

    setStatus(`✓ Loaded ${allFeatures.length} airspaces`, '#059669');

  } catch (err) {
    console.error(err);
    setStatus('✗ ' + err.message, '#dc2626');
    alert(
      'Could not load the KMZ.\n\n' + err.message + '\n\n' +
      'Checklist:\n' +
      `1. The file must be named exactly "${KMZ_FILENAME}" and be in the SAME folder as index.html.\n` +
      '2. You must be running this via a local server (http://localhost:8000), not by double-clicking the HTML.\n' +
      '3. Check the browser console (F12) for more details.'
    );
  }
}
loadKMZ();

// ---------------------------------------------------------------------
// Legend
// ---------------------------------------------------------------------
document.getElementById('legend').innerHTML = `
  <div><b style="background:#475569"></b>FIR / UIR</div>
  <div><b style="background:#6366f1"></b>CTA</div>
  <div><b style="background:#8b5cf6"></b>TMA</div>
  <div><b style="background:#2563eb"></b>CTR</div>
  <div><b style="background:#0891b2"></b>ATZ</div>
  <div><b style="background:#7c3aed"></b>SRA</div>
  <div><b style="background:#dc2626"></b>FAR (Restricted)</div>
  <div><b style="background:#d97706"></b>FAD (Danger)</div>
  <div><b style="background:#991b1b"></b>FAP (Prohibited)</div>
  <div style="margin-top:4px"><b style="background:#000;border-radius:50%"></b>Airport</div>
`;
</script>
</body>
</html>
