<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Africa Airspace (ATNS)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<style>
  html, body, #map { height: 100%; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
  #status {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,0.95); padding: 8px 14px; border-radius: 6px;
    font-size: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.18); max-width: 320px;
  }
  #legend {
    position: absolute; bottom: 24px; left: 10px; z-index: 1000;
    background: rgba(255,255,255,0.94); padding: 10px 14px; border-radius: 6px;
    font-size: 12px; line-height: 1.55; box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  #legend b { display: inline-block; width: 12px; height: 12px; margin-right: 6px;
              vertical-align: middle; border-radius: 2px; }
  .leaflet-popup-content { font-size: 13px; line-height: 1.45; margin: 12px 14px; max-height: 380px; overflow: auto; }
  .popup-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .popup-meta { color: #555; font-size: 12px; margin-bottom: 8px; }
  .popup-freq { background: #f0f9ff; border-left: 3px solid #0284c7; padding: 4px 8px; margin: 6px 0; }
  .ap-label { background: none !important; border: none !important; box-shadow: none !important;
              font: bold 11px/1 system-ui, sans-serif; color: #111;
              text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; }
  .ap-label::before { display: none; }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Loading…</div>
<div id="legend"></div>

<script>
// ============================================================
// CHANGE THIS if your KMZ has a different name
const KMZ_FILENAME = 'RSA DATA -01OCT2026.kmz';
// ============================================================

const statusEl = document.getElementById('status');
const setStatus = (txt, colour = '#111') => {
  statusEl.textContent = txt;
  statusEl.style.color = colour;
};

// ---------- Map + base layers ----------
const map = L.map('map', { maxZoom: 16, zoomControl: true });
const baseLayers = {
  'CARTO Light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 16
  }),
  'Esri Light Grey': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri', maxNativeZoom: 16, maxZoom: 16
  }),
  'OpenStreetMap': L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap', maxZoom: 16
  })
};
baseLayers['CARTO Light'].addTo(map);
map.fitBounds([[-35.2, 15.8], [-22.0, 33.2]]);

// ---------- Colour & style by airspace type ----------
function styleFor(feature) {
  const name = (feature.properties?.name || feature.properties?.Name || '').toUpperCase();
  let colour = '#2563eb';
  if (/^FAP\b|PROHIBITED/.test(name))       colour = '#991b1b';
  else if (/^FAR\b|RESTRICTED/.test(name))  colour = '#dc2626';
  else if (/^FAD\b|DANGER/.test(name))      colour = '#d97706';
  else if (/SRA|SPECIAL RULE/.test(name))   colour = '#7c3aed';
  else if (/CTR|CONTROL ZONE/.test(name))   colour = '#2563eb';
  else if (/TMA|TERMINAL/.test(name))       colour = '#8b5cf6';
  else if (/CTA|CONTROL AREA/.test(name))   colour = '#6366f1';
  else if (/ATZ|TRAFFIC ZONE/.test(name))   colour = '#0891b2';
  else if (/FIR|UIR|FLIGHT INFO/.test(name)) colour = '#475569';

  return {
    color: colour,
    weight: 1.8,
    opacity: 0.9,
    fillColor: colour,
    fillOpacity: 0.18
  };
}

// ---------- Extract frequencies from description / properties ----------
function extractFrequencies(props) {
  const text = [
    props.description || props.Description || '',
    props.frequency || props.Frequency || props.FREQ || '',
    Object.values(props).filter(v => typeof v === 'string').join(' ')
  ].join(' ');

  // Common patterns: 118.1, 124.65, 121.5 MHz, etc.
  const matches = text.match(/\b(1[1-3]\d\.\d{1,3}|1[1-3]\d)\s*(?:MHz|MHZ)?\b/gi) || [];
  const unique = [...new Set(matches.map(m => m.replace(/\s*(MHz|MHZ)/i, '').trim()))];
  return unique.slice(0, 8); // keep it reasonable
}

// ---------- Clean popup ----------
function popupFor(feature) {
  const p = feature.properties || {};
  const name = p.name || p.Name || p.NAME || 'Unnamed airspace';
  const freqs = extractFrequencies(p);

  let html = `<div class="popup-title">${name}</div>`;

  // Useful metadata first
  const priority = ['lower', 'upper', 'floor', 'ceiling', 'from', 'to', 'class', 'type', 'designator'];
  const shown = new Set(['name', 'Name', 'NAME', 'description', 'Description']);

  for (const key of Object.keys(p)) {
    if (shown.has(key) || p[key] == null || p[key] === '') continue;
    const low = key.toLowerCase();
    if (priority.some(pr => low.includes(pr))) {
      html += `<div class="popup-meta"><b>${key}:</b> ${p[key]}</div>`;
      shown.add(key);
    }
  }

  if (freqs.length) {
    html += `<div class="popup-freq"><b>Frequencies:</b> ${freqs.join(' · ')}</div>`;
  }

  // Remaining properties
  for (const [k, v] of Object.entries(p)) {
    if (shown.has(k) || v == null || v === '') continue;
    if (/description|name/i.test(k)) continue;
    html += `<div style="color:#666;font-size:12px"><span style="color:#888">${k}:</span> ${v}</div>`;
  }

  // Full description at the bottom if present
  if (p.description || p.Description) {
    html += `<div style="border-top:1px solid #e5e7eb;margin-top:8px;padding-top:6px;font-size:12px;color:#444">
               ${p.description || p.Description}
             </div>`;
  }
  return html;
}

// ---------- Hard-coded major airports (cleaner labels) ----------
const AIRPORTS = [
  ['FAAB',-28.57331,16.53433],['FABB',-26.24289,28.30078],['FABE',-32.89722,27.27917],
  ['FABL',-29.09673,26.30064],['FABM',-28.24861,28.33611],['FABW',-32.20833,22.93889],
  ['FACF',-34.18774,24.83051],['FACO',-29.93320,22.26574],['FACT',-33.97137,18.60429],
  ['FAEL',-33.03560,27.82316],['FAGC',-26.07420,28.13170],['FAGG',-34.00568,22.37596],
  ['FAGM',-26.24250,28.15120],['FAGR',-32.19116,24.53837],['FAGY',-29.11985,30.58722],
  ['FAHG',-26.50500,28.39400],['FAHL',-28.02000,32.28000],['FAHS',-24.35889,31.04750],
  ['FAKM',-28.80478,24.76403],['FAKN',-25.39103,31.09928],['FAKR',-26.08029,27.72452],
  ['FALA',-25.93969,27.92557],['FALE',-29.61177,31.11931],['FALM',-23.15945,29.70150],
  ['FALW',-32.96881,18.16526],['FALY',-28.57991,29.75274],['FAMD',-24.81378,31.54455],
  ['FAMG',-30.85737,30.34303],['FAMM',-25.80745,25.54447],['FAMN',-25.47333,31.56556],
  ['FAMO',-34.15729,22.06194],['FANC',-27.77278,29.97639],['FAOB',-34.55812,20.24856],
  ['FAOH',-33.60000,22.18333],['FAOR',-26.13703,28.24287],['FAPA',-33.55927,26.87797],
  ['FAPE',-33.99001,25.61028],['FAPG',-34.08816,23.32862],['FAPH',-23.93664,31.15510],
  ['FAPI',-23.92694,29.48436],['FAPM',-29.64679,30.39777],['FAPN',-25.33604,27.17163],
  ['FAPP',-23.84965,29.45649],['FAPS',-26.66829,27.08333],['FARB',-28.74114,32.09338],
  ['FASC',-26.52104,29.17222],['FASK',-25.80894,28.16697],['FASS',-27.64995,23.00305],
  ['FASZ',-24.96133,31.58882],['FATF',-28.26667,23.00000],['FATT',-26.78051,29.33909],
  ['FATW',-27.20313,22.48083],['FATZ',-23.83000,30.31667],['FAUL',-28.31947,31.41694],
  ['FAUP',-28.40130,21.25913],['FAUS',-24.78225,31.35417],['FAUT',-31.54645,28.67532],
  ['FAVG',-29.77083,31.06028],['FAVM',-22.44811,29.33778],['FAWB',-25.65531,28.22134],
  ['FAWI',-25.83378,29.19263],['FAWK',-25.82826,28.22275],['FAWN',-33.76972,18.74000],
  ['FAYP',-33.90099,18.49749]
];

const airportLayer = L.layerGroup();
AIRPORTS.forEach(([id, la, lo]) => {
  L.circleMarker([la, lo], {
    radius: 5, color: '#fff', weight: 1.5,
    fillColor: '#111', fillOpacity: 1
  })
  .bindTooltip(id, {
    permanent: true, direction: 'right', className: 'ap-label',
    offset: [6, 0], opacity: 0.95
  })
  .addTo(airportLayer);
});
airportLayer.addTo(map);

// ---------- Load KMZ ----------
async function loadKMZ() {
  try {
    setStatus('Fetching KMZ…');
    const response = await fetch(KMZ_FILENAME);
    if (!response.ok) throw new Error(`HTTP ${response.status} – is "${KMZ_FILENAME}" next to index.html?`);
    const blob = await response.blob();

    setStatus('Unzipping…');
    const zip = await JSZip.loadAsync(blob);

    const kmlFiles = Object.keys(zip.files).filter(f =>
      !zip.files[f].dir && f.toLowerCase().endsWith('.kml')
    );
    if (!kmlFiles.length) throw new Error('No .kml found inside the KMZ');

    const allFeatures = [];
    for (const filename of kmlFiles) {
      setStatus(`Parsing ${filename}…`);
      const kmlText = await zip.files[filename].async('text');
      const kml = new DOMParser().parseFromString(kmlText, 'text/xml');
      if (kml.querySelector('parsererror')) continue;
      const gj = toGeoJSON.kml(kml);
      if (gj.features) allFeatures.push(...gj.features);
    }

    // Split into polygons (airspaces) vs points (waypoints / navaids)
    const airspaces = allFeatures.filter(f =>
      f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon')
    );
    const points = allFeatures.filter(f =>
      f.geometry && f.geometry.type === 'Point'
    );

    setStatus(`Rendering ${airspaces.length} airspaces + ${points.length} points…`);

    // Airspace layer
    const airspaceLayer = L.geoJSON(
      { type: 'FeatureCollection', features: airspaces },
      {
        style: styleFor,
        onEachFeature: (f, layer) => {
          layer.bindPopup(popupFor(f), { maxWidth: 360 });
          layer.on('mouseover', e => {
            e.target.setStyle({ weight: 3.5, fillOpacity: 0.32 });
            e.target.bringToFront();
          });
          layer.on('mouseout', e => e.target.setStyle(styleFor(f)));
        }
      }
    );

    // Point layer (waypoints / navaids) – start OFF so the map isn’t a mess
    const pointLayer = L.geoJSON(
      { type: 'FeatureCollection', features: points },
      {
        pointToLayer: (f, latlng) => L.circleMarker(latlng, {
          radius: 3.5, color: '#64748b', weight: 1,
          fillColor: '#94a3b8', fillOpacity: 0.85
        }),
        onEachFeature: (f, layer) => {
          layer.bindPopup(popupFor(f), { maxWidth: 320 });
        }
      }
    );

    // Layer control
    const overlays = {
      'Airspaces': airspaceLayer,
      'Airports': airportLayer,
      'Waypoints / Navaids': pointLayer
    };
    L.control.layers(baseLayers, overlays, { collapsed: false }).addTo(map);

    airspaceLayer.addTo(map); // airspaces on by default

    setStatus(`✓ ${airspaces.length} airspaces loaded`, '#059669');
  } catch (err) {
    console.error(err);
    setStatus('✗ ' + err.message, '#dc2626');
    alert(
      'Could not load the KMZ.\n\n' + err.message +
      '\n\nMake sure:\n' +
      `1. File is named exactly "${KMZ_FILENAME}"\n` +
      '2. You are serving via a local server (python -m http.server or Live Server)\n' +
      '3. Check the browser console (F12)'
    );
  }
}

loadKMZ();

// ---------- Legend ----------
document.getElementById('legend').innerHTML = `
  <div style="font-weight:600;margin-bottom:4px">Airspace types</div>
  <div><b style="background:#475569"></b>FIR / UIR</div>
  <div><b style="background:#6366f1"></b>CTA</div>
  <div><b style="background:#8b5cf6"></b>TMA</div>
  <div><b style="background:#2563eb"></b>CTR</div>
  <div><b style="background:#0891b2"></b>ATZ</div>
  <div><b style="background:#7c3aed"></b>SRA</div>
  <div><b style="background:#dc2626"></b>FAR Restricted</div>
  <div><b style="background:#d97706"></b>FAD Danger</div>
  <div><b style="background:#991b1b"></b>FAP Prohibited</div>
  <div style="margin-top:6px"><b style="background:#111;border-radius:50%"></b>Airport</div>
`;
</script>
</body>
</html>
