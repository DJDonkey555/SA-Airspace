<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Africa Airspace — ATNS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<style>
:root{--sidebar-w:340px;--border:#e5e7eb;--hover:#f9fafb;--t1:#111827;--t2:#6b7280;--t3:#9ca3af}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;color:var(--t1)}
#app{display:flex;height:100vh;overflow:hidden}

/* Sidebar */
#sidebar{width:var(--sidebar-w);min-width:var(--sidebar-w);background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column}
#sidebar-header{padding:14px 18px 12px;border-bottom:1px solid var(--border)}
#sidebar-header h1{font-size:14px;font-weight:700;letter-spacing:-.01em}
#sidebar-header p{font-size:11px;color:var(--t2);margin-top:2px}
#search-box{padding:10px 14px;border-bottom:1px solid var(--border);position:relative}
#search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none;font-family:inherit;transition:border-color .15s,box-shadow .15s}
#search-input:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.1)}
#search-icon{position:absolute;left:24px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none;font-size:13px}
#filters{padding:10px 14px;border-bottom:1px solid var(--border)}
#filters-title{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
#filter-chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--t2);cursor:pointer;transition:all .15s;user-select:none}
.chip.on{color:#fff;border-color:currentColor}
.chip .chip-count{margin-left:4px;opacity:.75;font-weight:500}
#results-info{padding:8px 16px;font-size:11px;color:var(--t2);border-bottom:1px solid var(--border);background:#fafafa}
#results{flex:1;overflow-y:auto;scrollbar-width:thin}
#results::-webkit-scrollbar{width:6px}
#results::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px}
.result-item{padding:7px 16px;display:flex;align-items:flex-start;gap:8px;cursor:pointer;border-left:3px solid transparent;transition:background .1s,border-color .1s}
.result-item:hover{background:var(--hover)}
.result-item.selected{background:#eff6ff;border-left-color:#3b82f6}
.result-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px}
.result-body{flex:1;min-width:0}
.result-name{font-size:12px;font-weight:500;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result-meta{font-size:10px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.result-freq{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:9px;color:#1e40af;margin-top:2px}

/* Map */
#map-wrap{flex:1;position:relative}
#map{position:absolute;inset:0}
.leaflet-tile-pane{filter:saturate(.25) brightness(1.05) contrast(.85);opacity:.8}

/* Popup */
.leaflet-popup-content-wrapper{border-radius:8px;padding:0!important;box-shadow:0 10px 40px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);overflow:hidden}
.leaflet-popup-content{margin:0!important;padding:0;font-family:inherit;max-height:500px;overflow-y:auto}
.leaflet-popup-tip{box-shadow:none}
.leaflet-popup-close-button{color:#9ca3af!important;font-size:22px!important;padding:4px 8px!important;width:auto!important;height:auto!important}
.leaflet-popup-close-button:hover{color:#111827!important}
.as-popup{font-size:12px;color:var(--t1);line-height:1.45}
.as-popup-header{padding:12px 32px 12px 14px;background:#fafafa;border-bottom:1px solid var(--border)}
.as-popup-type{display:inline-flex;align-items:center;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px}
.as-popup-type .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
.as-popup-title{font-size:13px;font-weight:600;line-height:1.3}
.as-popup-section{padding:9px 14px;border-bottom:1px solid var(--border)}
.as-popup-section:last-child{border-bottom:none}
.as-popup-label{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.as-popup-value{font-weight:500}
.freq-chip{display:inline-block;padding:3px 8px;margin:2px 4px 2px 0;background:#eff6ff;color:#1e40af;border-radius:4px;font-family:"SF Mono",Menlo,Consolas,monospace;font-size:11px;font-weight:600}
.as-popup-row{margin:2px 0;font-size:11px}
.as-popup-key{color:var(--t2)}
.as-popup-desc{font-size:11px;color:#374151;max-height:200px;overflow-y:auto;padding:4px 0;line-height:1.5}
.as-popup-desc table{border-collapse:collapse;width:100%}
.as-popup-desc td,.as-popup-desc th{padding:2px 4px;border:1px solid var(--border)}

/* Map controls */
#map-controls{position:absolute;top:12px;right:12px;z-index:400;display:flex;flex-direction:column;gap:6px}
.map-btn{background:#fff;border:1px solid var(--border);border-radius:6px;padding:7px 11px;font-size:12px;font-weight:500;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08);font-family:inherit;color:var(--t1);transition:background .15s,transform .05s}
.map-btn:hover{background:#f9fafb}
.map-btn:active{transform:scale(.98)}

/* Loading */
#loading{position:absolute;inset:0;background:#fff;z-index:5000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .3s}
#loading.hidden{opacity:0;pointer-events:none}
.spinner{width:36px;height:36px;border:3px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#loading-text{font-size:13px;color:var(--t2)}
#loading-error{max-width:420px;padding:16px;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;color:#991b1b;font-size:12px;line-height:1.5;white-space:pre-wrap}

/* Airport labels */
.airport-label{background:transparent!important;border:none!important;box-shadow:none!important;font-family:-apple-system,sans-serif!important;font-size:10px!important;font-weight:600!important;color:#1e293b!important;padding:0!important;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff!important;letter-spacing:.02em!important}
.airport-label::before{display:none!important}

/* Live aircraft icons */
.live-plane-icon{background:transparent!important;border:none!important;box-shadow:none!important;display:flex!important;align-items:center;justify-content:center}
.live-plane-icon svg{filter:drop-shadow(0 0 2px rgba(0,0,0,.45))}

/* Mobile */
@media(max-width:768px){#app{flex-direction:column}#sidebar{width:100%;min-width:0;max-height:40vh;border-right:none;border-bottom:1px solid var(--border)}#map-wrap{min-height:60vh}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div id="sidebar-header">
      <h1>South Africa Airspace</h1>
      <p>ATNS · search, filter, or click a shape</p>
    </div>
    <div id="search-box">
      <span id="search-icon">🔍</span>
      <input id="search-input" type="text" placeholder="Search name, type, frequency…" autocomplete="off">
    </div>
    <div id="filters">
      <div id="filters-title">Filter by type</div>
      <div id="filter-chips"></div>
    </div>
    <div id="results-info">Loading…</div>
    <div id="results"></div>
  </aside>
  <main id="map-wrap">
    <div id="map"></div>
    <div id="map-controls">
      <button class="map-btn" id="btn-basemap">🗺️ Street</button>
      <button class="map-btn" id="btn-fit">📍 Fit SA</button>
    </div>
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">Loading airspaces…</div>
    </div>
  </main>
</div>
<script>
/* ============ CONFIG ============ */
const KMZ_FILENAME = 'RSA DATA -01OCT2026.kmz';

const TYPE_INFO = {
  FIR:  {label:'FIR',   colour:'#64748b', description:'Flight Information Region'},
  CTA:  {label:'CTA',   colour:'#a78bfa', description:'Control Area'},
  TMA:  {label:'TMA',   colour:'#818cf8', description:'Terminal Control Area'},
  CTR:  {label:'CTR',   colour:'#3b82f6', description:'Control Zone'},
  ATZ:  {label:'ATZ',   colour:'#06b6d4', description:'Aerodrome Traffic Zone'},
  SRA:  {label:'SRA',   colour:'#22c55e', description:'Special Rules Area'},
  FAR:  {label:'FAR',   colour:'#ef4444', description:'Restricted Area'},
  FAD:  {label:'FAD',   colour:'#f59e0b', description:'Danger Area'},
  FAP:  {label:'FAP',   colour:'#b91c1c', description:'Prohibited Area'},
  OTHER:{label:'Other', colour:'#94a3b8', description:'Other airspace'}
};

/* ============ HELPERS ============ */
function detectType(name, props = {}) {
  const explicit = props.type || props.Type || props.airspaceType || props.AirspaceType;
  if (explicit) {
    const e = String(explicit).toUpperCase();
    if (TYPE_INFO[e]) return e;
    if (/PROHIBITED/.test(e)) return 'FAP';
    if (/RESTRICTED/.test(e)) return 'FAR';
    if (/DANGER/.test(e)) return 'FAD';
    if (/SPECIAL RULE/.test(e)) return 'SRA';
    if (/CONTROL ZONE|CTR/.test(e)) return 'CTR';
    if (/TERMINAL/.test(e)) return 'TMA';
    if (/CONTROL AREA|CTA/.test(e)) return 'CTA';
    if (/TRAFFIC ZONE|ATZ/.test(e)) return 'ATZ';
    if (/FLIGHT INFO|FIR/.test(e)) return 'FIR';
  }
  const u = String(name || '').toUpperCase().trim();
  if (/^FAP\b/.test(u)) return 'FAP';
  if (/^FAR\b/.test(u)) return 'FAR';
  if (/^FAD\b/.test(u)) return 'FAD';
  if (/\bSRA\b|SPECIAL RULE/.test(u)) return 'SRA';
  if (/\bCTR\b|CONTROL ZONE/.test(u)) return 'CTR';
  if (/\bTMA\b|TERMINAL/.test(u)) return 'TMA';
  if (/\bCTA\b|CONTROL AREA/.test(u)) return 'CTA';
  if (/\bATZ\b|TRAFFIC ZONE/.test(u)) return 'ATZ';
  if (/\bFIR\b|\bUIR\b|FLIGHT INFO/.test(u)) return 'FIR';
  return 'OTHER';
}

function sanitizeHtml(html) {
  if (!html) return '';
  const d = document.createElement('div');
  d.innerHTML = String(html);
  d.querySelectorAll('script,style,iframe,object,embed').forEach(el => el.remove());
  d.querySelectorAll('*').forEach(el => {
    [...el.attributes].forEach(a => {
      if (/^on/i.test(a.name)) el.removeAttribute(a.name);
      if (a.name === 'href' && /^\s*javascript:/i.test(a.value)) el.removeAttribute(a.name);
    });
  });
  return d.innerHTML;
}

const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function extractFrequencies(obj) {
  const parts = [];
  for (const [k, v] of Object.entries(obj)) {
    if (v != null && typeof v !== 'object') parts.push(String(v));
  }
  const text = parts.join(' ');
  const matches = text.match(/\b1[0-3][0-9][.,]\d{1,3}\b/g) || [];
  const seen = new Set(), out = [];
  for (const m of matches) {
    const n = parseFloat(m.replace(',', '.'));
    if (n >= 108 && n <= 137) {
      const s = n.toFixed(3);
      if (!seen.has(s)) { seen.add(s); out.push(s); }
    }
  }
  return out.sort();
}

function computeArea(feature) {
  const g = feature.geometry;
  if (!g) return 0;
  const rings = g.type === 'Polygon' ? [g.coordinates[0]] :
                g.type === 'MultiPolygon' ? g.coordinates.map(c => c[0]) : [];
  let total = 0;
  for (const ring of rings) {
    if (!ring || !ring.length) continue;
    let a = 0;
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      a += (ring[j][0] + ring[i][0]) * (ring[j][1] - ring[i][1]);
    }
    total += Math.abs(a / 2);
  }
  return total;
}

/* ============ MAP ============ */
const map = L.map('map', {maxZoom: 16, minZoom: 4, zoomControl: true});
const basemaps = {
  'Street':   L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {attribution:'© OpenStreetMap', maxZoom:19}),
  'Terrain':  L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {attribution:'© OpenTopoMap', maxZoom:17}),
  'Outdoor':  L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {attribution:'© CyclOSM', maxZoom:19}),
  'Blank':    L.gridLayer({attribution:''})
};
let currentBasemap = 'Street';
basemaps[currentBasemap].addTo(map);
map.fitBounds([[-35, 16], [-22, 33]]);

/* Airports */
const AIRPORTS = [
  ['FAAB',-28.57331,16.53433],['FABB',-26.24289,28.30078],['FABE',-32.89722,27.27917],
  ['FABL',-29.09673,26.30064],['FABM',-28.24861,28.33611],['FABW',-32.20833,22.93889],
  ['FACF',-34.18774,24.83051],['FACO',-29.93320,22.26574],['FACT',-33.97137,18.60429],
  ['FAEL',-33.03560,27.82316],['FAGC',-26.07420,28.13170],['FAGG',-34.00568,22.37596],
  ['FAGM',-26.24250,28.15120],['FAGR',-32.19116,24.53837],['FAGY',-29.11985,30.58722],
  ['FAHG',-26.50500,28.39400],['FAHL',-28.02000,32.28000],['FAHS',-24.35889,31.04750],
  ['FAKM',-28.80478,24.76403],['FAKN',-25.39103,31.09928],['FAKR',-26.08029,27.72452],
  ['FALA',-25.93969,27.92557],['FALE',-29.61177,31.11931],['FALM',-23.15945,29.70150],
  ['FALW',-32.96881,18.16526],['FALY',-28.57991,29.75274],['FAMD',-24.81378,31.54455],
  ['FAMG',-30.85737,30.34303],['FAMM',-25.80745,25.54447],['FAMN',-25.47333,31.56556],
  ['FAMO',-34.15729,22.06194],['FANC',-27.77278,29.97639],['FAOB',-34.55812,20.24856],
  ['FAOH',-33.60000,22.18333],['FAOR',-26.13703,28.24287],['FAPA',-33.55927,26.87797],
  ['FAPE',-33.99001,25.61028],['FAPG',-34.08816,23.32862],['FAPH',-23.93664,31.15510],
  ['FAPI',-23.92694,29.48436],['FAPM',-29.64679,30.39777],['FAPN',-25.33604,27.17163],
  ['FAPP',-23.84965,29.45649],['FAPS',-26.66829,27.08333],['FARB',-28.74114,32.09338],
  ['FASC',-26.52104,29.17222],['FASK',-25.80894,28.16697],['FASS',-27.64995,23.00305],
  ['FASZ',-24.96133,31.58882],['FATF',-28.26667,23.00000],['FATT',-26.78051,29.33909],
  ['FATW',-27.20313,22.48083],['FATZ',-23.83000,30.31667],['FAUL',-28.31947,31.41694],
  ['FAUP',-28.40130,21.25913],['FAUS',-24.78225,31.35417],['FAUT',-31.54645,28.67532],
  ['FAVG',-29.77083,31.06028],['FAVM',-22.44811,29.33778],['FAWB',-25.65531,28.22134],
  ['FAWI',-25.83378,29.19263],['FAWK',-25.82826,28.22275],['FAWN',-33.76972,18.74000],
  ['FAYP',-33.90099,18.49749]
];
AIRPORTS.forEach(([id, la, lo]) =>
  L.circleMarker([la, lo], {radius:3.5, color:'#fff', weight:1.5, fillColor:'#0f172a', fillOpacity:1, interactive:false})
   .bindTooltip(id, {permanent:true, direction:'right', className:'airport-label', offset:[5,0]})
   .addTo(map));

/* ============ STATE ============ */
const state = {
  items: [],
  selected: null,
  activeTypes: new Set(Object.keys(TYPE_INFO)),
  searchQuery: ''
};
const airspaceLayers = new Map();

/* ============ PARSING ============ */
function parseAirspace(feature) {
  const p = feature.properties || {};
  const name = p.Name || p.name || p.NAME || p.title || p.TITLE || 'Unnamed airspace';
  const type = detectType(name, p);
  const upper = p.UpperLimit || p.upperLimit || p.upper || p.Upper || p.UPPER || p['Upper Limit'] || '';
  const lower = p.LowerLimit || p.lowerLimit || p.lower || p.Lower || p.LOWER || p['Lower Limit'] || '';
  const vertical = (upper || lower) ? `${lower || '?'} – ${upper || '?'}` : '';
  const cls = p.Class || p.class || p.CLASS || p.airspaceClass || p.AirspaceClass || '';
  const description = p.Description || p.description || '';
  const freqs = extractFrequencies(p);

  const skipKeys = new Set(['Name','name','NAME','title','TITLE','Description','description',
    'UpperLimit','upperLimit','upper','Upper','UPPER','Upper Limit',
    'LowerLimit','lowerLimit','lower','Lower','LOWER','Lower Limit',
    'Class','class','CLASS','airspaceClass','AirspaceClass']);
  const extras = [];
  for (const [k, v] of Object.entries(p)) {
    if (skipKeys.has(k) || v == null || v === '' || typeof v === 'object') continue;
    extras.push([k, String(v)]);
  }

  return {feature, name, type, vertical, cls, description, freqs, extras, area: computeArea(feature)};
}

/* ============ POPUP ============ */
function popupHtml(item) {
  const t = TYPE_INFO[item.type] || TYPE_INFO.OTHER;
  let h = `<div class="as-popup"><div class="as-popup-header">
    <div class="as-popup-type" style="color:${t.colour}">
      <span class="dot" style="background:${t.colour}"></span>${t.label}${item.cls ? ' · ' + escapeHtml(item.cls) : ''}
    </div>
    <div class="as-popup-title">${escapeHtml(item.name)}</div>
  </div>`;

  if (item.vertical) h += `<div class="as-popup-section"><div class="as-popup-label">Vertical Limits</div><div class="as-popup-value">${escapeHtml(item.vertical)}</div></div>`;

  if (item.freqs.length) h += `<div class="as-popup-section"><div class="as-popup-label">Frequencies</div>${item.freqs.map(f => `<span class="freq-chip">${f} MHz</span>`).join('')}</div>`;

  if (item.extras.length) h += `<div class="as-popup-section"><div class="as-popup-label">Details</div>${item.extras.map(([k, v]) => {
    const disp = /<[a-z]/i.test(v) ? sanitizeHtml(v) : escapeHtml(v);
    return `<div class="as-popup-row"><span class="as-popup-key">${escapeHtml(k)}:</span> ${disp}</div>`;
  }).join('')}</div>`;

  if (item.description) {
    const d = String(item.description);
    const rendered = /<[a-z][\s\S]*>/i.test(d) ? sanitizeHtml(d) : escapeHtml(d).replace(/\n/g, '<br>');
    h += `<div class="as-popup-section"><div class="as-popup-label">Notes</div><div class="as-popup-desc">${rendered}</div></div>`;
  }
  return h + '</div>';
}

/* ============ STYLING ============ */
function styleFor(item, mode = 'base') {
  const t = TYPE_INFO[item.type] || TYPE_INFO.OTHER;
  const base = {color: t.colour, fillColor: t.colour};
  switch (mode) {
    case 'hover':    return {...base, weight: 3,   fillOpacity: 0.25, opacity: 1};
    case 'selected': return {...base, weight: 3,   fillOpacity: 0.35, opacity: 1};
    case 'dimmed':   return {...base, weight: 1,   fillOpacity: 0.02, opacity: 0.15};
    default:         return {...base, weight: 1.5, fillOpacity: 0.08, opacity: 1};
  }
}

function createAirspaceLayer(item) {
  const layer = L.geoJSON(item.feature, {
    style: () => styleFor(item, 'base'),
    interactive: true,
    bubblingMouseEvents: false
  });
  layer.on('mouseover', () => {
    if (state.selected === item) return;
    layer.eachLayer(l => l.setStyle && l.setStyle(styleFor(item, 'hover')));
  });
  layer.on('mouseout', () => {
    if (state.selected === item) return;
    layer.eachLayer(l => l.setStyle && l.setStyle(styleFor(item, 'base')));
  });
  layer.on('click', e => {
    L.DomEvent.stopPropagation(e);
    selectAirspace(item, {fly: false, openPopup: true});
  });
  layer.bindPopup(popupHtml(item), {maxWidth: 380, minWidth: 280, maxHeight: 500, autoPanPadding: [20, 20]});
  return layer;
}

function updateLayerStyle(item, mode) {
  const layer = airspaceLayers.get(item);
  if (layer) layer.eachLayer(l => l.setStyle && l.setStyle(styleFor(item, mode)));
}

/* ============ SELECTION ============ */
function selectAirspace(item, opts = {}) {
  if (state.selected && state.selected !== item) updateLayerStyle(state.selected, 'base');
  state.selected = item;
  updateLayerStyle(item, 'selected');
  const layer = airspaceLayers.get(item);

  if (layer && opts.fly) {
    const bounds = layer.getBounds();
    const target = bounds.getCenter();
    let done = false;
    const openIt = () => { if (done) return; done = true; if (opts.openPopup) layer.openPopup(target); };
    map.once('moveend', openIt);
    setTimeout(openIt, 500);
    map.fitBounds(bounds, {padding: [60, 60], maxZoom: 11});
  } else if (layer && opts.openPopup) {
    layer.openPopup(layer.getBounds().getCenter());
  }

  document.querySelectorAll('#results .result-item').forEach(el => el.classList.remove('selected'));
  const idx = state.items.indexOf(item);
  const selEl = document.querySelector(`#results .result-item[data-idx="${idx}"]`);
  if (selEl) { selEl.classList.add('selected'); selEl.scrollIntoView({behavior:'smooth', block:'nearest'}); }
}

function clearSelection() {
  if (state.selected) updateLayerStyle(state.selected, 'base');
  state.selected = null;
  document.querySelectorAll('#results .result-item').forEach(el => el.classList.remove('selected'));
  map.closePopup();
}

/* ============ SIDEBAR ============ */
function renderFilters() {
  const counts = {};
  state.items.forEach(it => { counts[it.type] = (counts[it.type] || 0) + 1; });
  document.getElementById('filter-chips').innerHTML = Object.keys(TYPE_INFO)
    .filter(k => counts[k] > 0)
    .map(k => {
      const t = TYPE_INFO[k], on = state.activeTypes.has(k);
      return `<span class="chip ${on ? 'on' : ''}" data-type="${k}" style="${on ? `background:${t.colour};border-color:${t.colour}` : ''}">${t.label}<span class="chip-count">${counts[k]}</span></span>`;
    }).join('');
  document.querySelectorAll('#filter-chips .chip').forEach(el => {
    el.addEventListener('click', () => {
      const t = el.dataset.type;
      if (state.activeTypes.has(t)) state.activeTypes.delete(t);
      else state.activeTypes.add(t);
      renderFilters(); applyFilters(); renderResults();
    });
  });
}

function renderResults() {
  const q = state.searchQuery.toLowerCase().trim();
  const visible = state.items.filter(it => {
    if (!state.activeTypes.has(it.type)) return false;
    if (q && !`${it.name} ${it.type} ${it.vertical} ${it.freqs.join(' ')}`.toLowerCase().includes(q)) return false;
    return true;
  });
  visible.sort((a, b) => a.type !== b.type ? a.type.localeCompare(b.type) : a.name.localeCompare(b.name));
  document.getElementById('results-info').textContent = `${visible.length} of ${state.items.length} airspaces`;

  document.getElementById('results').innerHTML = visible.length
    ? visible.map(it => {
        const t = TYPE_INFO[it.type] || TYPE_INFO.OTHER;
        const sel = state.selected === it ? ' selected' : '';
        const meta = it.vertical ? `<div class="result-meta">${escapeHtml(it.vertical)}</div>` : '';
        const freq = it.freqs.length ? `<div class="result-freq">${escapeHtml(it.freqs.join(' · '))} MHz</div>` : '';
        return `<div class="result-item${sel}" data-idx="${state.items.indexOf(it)}">
          <div class="result-dot" style="background:${t.colour}"></div>
          <div class="result-body">
            <div class="result-name">${escapeHtml(it.name)}</div>${meta}${freq}
          </div></div>`;
      }).join('')
    : '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:12px">No airspaces match your filters</div>';

  document.querySelectorAll('#results .result-item').forEach(el => {
    const idx = parseInt(el.dataset.idx);
    el.addEventListener('click', () => selectAirspace(state.items[idx], {fly: true, openPopup: true}));
  });
}

/* ============ FILTERS ============ */
function applyFilters() {
  state.items.forEach(it => {
    const layer = airspaceLayers.get(it);
    if (!layer) return;
    if (state.selected === it) return;
    if (!state.activeTypes.has(it.type)) {
      if (map.hasLayer(layer)) map.removeLayer(layer);
    } else {
      if (!map.hasLayer(layer)) layer.addTo(map);
      layer.eachLayer(l => l.setStyle && l.setStyle(styleFor(it, 'base')));
    }
  });
  applySearch();
}

function applySearch() {
  const q = state.searchQuery.toLowerCase().trim();
  state.items.forEach(it => {
    const layer = airspaceLayers.get(it);
    if (!layer || !map.hasLayer(layer) || state.selected === it) return;
    if (!q) { layer.eachLayer(l => l.setStyle && l.setStyle(styleFor(it, 'base'))); return; }
    const match = `${it.name} ${it.type} ${it.vertical} ${it.freqs.join(' ')}`.toLowerCase().includes(q);
    layer.eachLayer(l => l.setStyle && l.setStyle(styleFor(it, match ? 'base' : 'dimmed')));
  });
}

/* ============ KMZ LOADING ============ */
async function loadKMZ() {
  const loading = document.getElementById('loading');
  const txt = document.getElementById('loading-text');
  const set = t => txt.textContent = t;

  try {
    set('Fetching KMZ…');
    const res = await fetch(KMZ_FILENAME);
    if (!res.ok) throw new Error(`HTTP ${res.status} — is "${KMZ_FILENAME}" in the same folder?`);
    const blob = await res.blob();

    set('Unzipping…');
    const zip = await JSZip.loadAsync(blob);
    const kmlFiles = Object.keys(zip.files).filter(f => f.toLowerCase().endsWith('.kml'));
    if (!kmlFiles.length) throw new Error('No .kml file found inside the KMZ.');

    set(`Parsing ${kmlFiles.length} KML file${kmlFiles.length > 1 ? 's' : ''}…`);
    const all = [];
    for (const f of kmlFiles) {
      const text = await zip.files[f].async('text');
      const kml = new DOMParser().parseFromString(text, 'text/xml');
      if (kml.querySelector('parsererror')) { console.warn(`Parse error in ${f}`); continue; }
      const gj = toGeoJSON.kml(kml);
      if (gj.features) all.push(...gj.features);
    }

    const polys = all.filter(f => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'));
    if (!polys.length) throw new Error(`Parsed ${all.length} features, but no polygons found.`);

    set(`Building ${polys.length} airspaces…`);
    state.items = polys.map(parseAirspace).sort((a, b) => b.area - a.area);

    for (const item of state.items) {
      const layer = createAirspaceLayer(item);
      airspaceLayers.set(item, layer);
      if (state.activeTypes.has(item.type)) layer.addTo(map);
    }

    renderFilters();
    renderResults();
    loading.classList.add('hidden');
    console.log(`Loaded ${state.items.length} airspaces.`);

  } catch (err) {
    console.error(err);
    loading.innerHTML = `<div id="loading-error"><b>Could not load the airspace file</b><br><br>${escapeHtml(err.message)}\n\nChecklist:\n1. "${KMZ_FILENAME}" must be in the same folder as index.html\n2. Page must be served over HTTP (not file://)\n3. Check browser console (F12) for details</div>`;
  }
}

/* ============ INTERACTIONS ============ */
let searchDebounce;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    state.searchQuery = e.target.value;
    applySearch();
    renderResults();
  }, 150);
});

document.getElementById('btn-fit').addEventListener('click', () => {
  map.fitBounds([[-35, 16], [-22, 33]]);
  clearSelection();
});

document.getElementById('btn-basemap').addEventListener('click', e => {
  const names = Object.keys(basemaps);
  const next = names[(names.indexOf(currentBasemap) + 1) % names.length];
  map.removeLayer(basemaps[currentBasemap]);
  map.addLayer(basemaps[next]);
  currentBasemap = next;
  e.target.textContent = '🗺️ ' + next;
});

map.on('click', clearSelection);
document.addEventListener('keydown', e => { if (e.key === 'Escape') clearSelection(); });

/* ============ LIVE TRAFFIC (OpenSky via Cloudflare Worker Proxy) ============ */
/* OpenSky blocks direct browser requests from other domains.
   This routes the call through a free Cloudflare Worker that adds the CORS header. */
const LIVE_REFRESH_MS = 60000; // 60 s keeps anonymous OpenSky credit use reasonable.
const SOUTH_AFRICA_BBOX = {
  lamin: -35.0,   // south
  lomin: 16.0,    // west
  lamax: -22.0,   // north
  lomax: 33.0     // east
};

// ⚠️ REPLACE THIS with your own Cloudflare Worker URL (see instructions below).
const PROXY_URL = 'https://your-worker-name.your-subdomain.workers.dev/?url=';

const liveTrafficLayer = L.layerGroup().addTo(map);
let liveTimer = null;
let liveOn = true;
let liveCount = 0;
let liveLastUpdate = null;
let liveBusy = false;

function planeIconFor(track) {
  const rot = Number.isFinite(track) ? track : 0;
  return L.divIcon({
    className: 'live-plane-icon',
    html: `<svg viewBox="0 0 24 24" width="20" height="20">
      <path transform="rotate(${rot} 12 12)"
        d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"
        fill="#0f172a" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
    </svg>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });
}

async function refreshLiveTraffic() {
  if (!liveOn || liveBusy) return;
  liveBusy = true;
  setLiveButton('loading');

  const { lamin, lomin, lamax, lomax } = SOUTH_AFRICA_BBOX;
  const openskyUrl = `https://opensky-network.org/api/states/all?lamin=${lamin}&lomin=${lomin}&lamax=${lamax}&lomax=${lomax}`;
  const proxiedUrl = PROXY_URL + encodeURIComponent(openskyUrl);

  try {
    const res = await fetch(proxiedUrl, {cache: 'no-store'});
    if (!res.ok) throw new Error(`Proxy returned HTTP ${res.status}`);
    const data = await res.json();

    liveTrafficLayer.clearLayers();

    if (!data.states || data.states.length === 0) {
      liveCount = 0;
      liveLastUpdate = new Date();
      setLiveButton('ok');
      return;
    }

    for (const s of data.states) {
      const lat = s[6];
      const lon = s[5];
      if (lat == null || lon == null) continue; // skip missing positions

      const callsign = (s[1] || '').trim() || s[0] || 'Unknown';
      const altitude = s[7] != null ? `${Math.round(s[7])} m` : 'N/A';
      const speed = s[9] != null ? `${Math.round(s[9] * 3.6)} km/h` : 'N/A';
      const heading = s[10] != null ? s[10] : 0;
      const squawk = s[14] || '';
      const onGround = s[8] === true;

      const marker = L.marker([lat, lon], {icon: planeIconFor(heading)});
      marker.bindPopup(`
        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;line-height:1.5;min-width:200px">
          <div style="font-weight:700;font-size:13px;margin-bottom:4px">${escapeHtml(callsign)}</div>
          <div><span style="color:#6b7280">ICAO24:</span> ${escapeHtml(s[0])}</div>
          <div><span style="color:#6b7280">Altitude:</span> ${altitude}</div>
          <div><span style="color:#6b7280">Speed:</span> ${speed}</div>
          <div><span style="color:#6b7280">Heading:</span> ${Math.round(heading)}°</div>
          ${squawk ? `<div><span style="color:#6b7280">Squawk:</span> ${escapeHtml(squawk)}</div>` : ''}
          ${onGround ? `<div style="color:#f59e0b;font-weight:600">On ground</div>` : ''}
        </div>
      `, {maxWidth: 260});

      liveTrafficLayer.addLayer(marker);
    }

    liveCount = data.states.length;
    liveLastUpdate = new Date();
    setLiveButton('ok');
    console.log(`Proxy → OpenSky: ${liveCount} aircraft over South Africa.`);
  } catch (err) {
    console.warn('Live traffic error:', err.message);
    setLiveButton('error', err.message);
  } finally {
    liveBusy = false;
  }
}

function setLiveButton(mode, msg) {
  const btn = document.getElementById('btn-live-traffic');
  if (!btn) return;
  if (!liveOn) { btn.textContent = '✈️ Live: OFF'; btn.title = ''; return; }
  if (mode === 'loading') { btn.textContent = '✈️ Updating…'; return; }
  if (mode === 'error') { btn.textContent = '✈️ Live: error'; btn.title = msg || 'Could not fetch live traffic'; return; }
  btn.textContent = `✈️ Live: ${liveCount}`;
  btn.title = liveLastUpdate ? `Last update: ${liveLastUpdate.toLocaleTimeString()}` : '';
}

function startLiveTraffic() {
  if (liveTimer) clearInterval(liveTimer);
  refreshLiveTraffic();
  liveTimer = setInterval(refreshLiveTraffic, LIVE_REFRESH_MS);
}

function stopLiveTraffic() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  liveTrafficLayer.clearLayers();
  liveCount = 0;
}

/* Live traffic toggle button */
const liveBtn = document.createElement('button');
liveBtn.className = 'map-btn';
liveBtn.id = 'btn-live-traffic';
liveBtn.textContent = '✈️ Live: …';
liveBtn.title = 'Live aircraft over South Africa (OpenSky via proxy)';
liveBtn.addEventListener('click', () => {
  liveOn = !liveOn;
  if (liveOn) { setLiveButton('loading'); startLiveTraffic(); }
  else { stopLiveTraffic(); setLiveButton('off'); }
});
document.getElementById('map-controls').appendChild(liveBtn);

/* Kick off live traffic */
startLiveTraffic();

/* ============ START ============ */
loadKMZ();
</script>
