<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>South Africa Airspace</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
<style>
  :root {
    --bg: #0b1120;
    --panel: rgba(15, 23, 42, 0.94);
    --border: rgba(148, 163, 184, 0.18);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #map { height: 100%; background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; }

  /* Status pill */
  #status {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 1100; background: var(--panel); color: var(--text);
    padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 500;
    border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.45);
    backdrop-filter: blur(12px); transition: opacity .4s;
  }

  /* Custom layer control */
  .leaflet-control-layers {
    background: var(--panel) !important;
    border: 1px solid var(--border) !important;
    border-radius: 12px !important;
    box-shadow: 0 12px 32px rgba(0,0,0,.5) !important;
    backdrop-filter: blur(12px);
    color: var(--text) !important;
    min-width: 210px;
  }
  .leaflet-control-layers-expanded { padding: 12px 14px 10px !important; }
  .leaflet-control-layers-base label,
  .leaflet-control-layers-overlays label {
    color: var(--text) !important; font-size: 13px; margin: 3px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .leaflet-control-layers-separator { border-top: 1px solid var(--border) !important; margin: 8px 0 !important; }
  .leaflet-control-layers-toggle { background-color: var(--panel) !important; border-radius: 10px !important; }

  /* Zoom buttons */
  .leaflet-bar {
    border: 1px solid var(--border) !important;
    border-radius: 10px !important;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(0,0,0,.4) !important;
  }
  .leaflet-bar a {
    background: var(--panel) !important; color: var(--text) !important;
    border-bottom: 1px solid var(--border) !important;
    width: 34px !important; height: 34px !important; line-height: 34px !important;
    font-size: 16px !important;
  }
  .leaflet-bar a:hover { background: #1e293b !important; color: #fff !important; }

  /* Popups */
  .leaflet-popup-content-wrapper {
    background: #1e293b; color: var(--text);
    border-radius: 12px; border: 1px solid var(--border);
    box-shadow: 0 16px 40px rgba(0,0,0,.55);
  }
  .leaflet-popup-tip { background: #1e293b; }
  .leaflet-popup-content { margin: 14px 16px; min-width: 180px; }
  .p-name { font-size: 16px; font-weight: 700; color: #f8fafc; margin-bottom: 6px; }
  .p-limits { font-size: 13px; color: var(--accent); margin-bottom: 8px; font-weight: 500; }
  .p-freq { font-size: 13px; line-height: 1.55; color: #e2e8f0; }
  .p-freq span { color: var(--muted); display: inline-block; min-width: 72px; }

  /* Airport labels */
  .ap-label {
    background: none !important; border: none !important; box-shadow: none !important;
    font: 700 11px/1 'Segoe UI', system-ui, sans-serif; color: #f8fafc;
    text-shadow: 0 0 5px #000, 0 0 5px #000, 0 1px 3px #000;
  }
  .ap-label::before { display: none; }

  /* Legend */
  #legend {
    position: absolute; bottom: 28px; left: 14px; z-index: 1000;
    background: var(--panel); color: var(--text); padding: 12px 16px;
    border-radius: 12px; font-size: 12px; line-height: 1.65;
    border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(0,0,0,.45);
    backdrop-filter: blur(12px);
  }
  #legend .title { font-weight: 600; color: var(--accent); margin-bottom: 6px; letter-spacing: .03em; font-size: 11px; }
  #legend b { display: inline-block; width: 11px; height: 11px; margin-right: 7px; vertical-align: middle; border-radius: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Loading…</div>
<div id="legend"></div>

<script>
const KMZ = 'RSA DATA -01OCT2026.kmz';

const statusEl = document.getElementById('status');
const setStatus = (t, c = '#f1f5f9') => { statusEl.textContent = t; statusEl.style.color = c; };

// ---------- Map + panes ----------
const map = L.map('map', {
  maxZoom: 16,
  zoomControl: false,
  preferCanvas: true
});
L.control.zoom({ position: 'topright' }).addTo(map);

// Higher pane so airports & waypoints always sit above airspaces
map.createPane('airports');
map.getPane('airports').style.zIndex = 650;
map.createPane('points');
map.getPane('points').style.zIndex = 640;

// Base layers – Dark is default
const baseLayers = {
  'Dark': L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 16
  }),
  'Light': L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO', maxZoom: 16
  }),
  'Esri Grey': L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Esri', maxNativeZoom: 16, maxZoom: 16
  })
};
baseLayers['Dark'].addTo(map);          // ← DEFAULT
map.fitBounds([[-35.0, 15.5], [-22.0, 33.5]]);

// ---------- Classification ----------
function classify(name = '') {
  const n = (name || '').toUpperCase();
  if (/PROHIBITED|^FAP\b/.test(n)) return { type: 'prohibited', prio: 90, color: '#b91c1c', fill: 0.32, interactive: true };
  if (/RESTRICTED|^FAR\b|HARBOUR/.test(n)) return { type: 'restricted', prio: 80, color: '#dc2626', fill: 0.26, interactive: true };
  if (/DANGER|^FAD\b/.test(n)) return { type: 'danger', prio: 70, color: '#d97706', fill: 0.24, interactive: true };
  if (/ATZ/.test(n)) return { type: 'atz', prio: 60, color: '#06b6d4', fill: 0.22, interactive: true };
  if (/CTR/.test(n)) return { type: 'ctr', prio: 55, color: '#3b82f6', fill: 0.22, interactive: true };
  if (/SRA|SPECIAL RULE/.test(n)) return { type: 'sra', prio: 50, color: '#a855f7', fill: 0.18, interactive: true };
  if (/TMA/.test(n)) return { type: 'tma', prio: 40, color: '#8b5cf6', fill: 0.16, interactive: true };
  if (/CTA|ACC |FIS /.test(n)) return { type: 'cta', prio: 25, color: '#6366f1', fill: 0.10, interactive: false }; // non-interactive
  if (/FIR|UIR/.test(n)) return { type: 'fir', prio: 5, color: '#64748b', fill: 0.04, interactive: false };  // non-interactive
  return { type: 'other', prio: 15, color: '#64748b', fill: 0.08, interactive: false };
}

function styleFor(f) {
  const c = classify(f.properties?.name || f.properties?.Name || '');
  return {
    color: c.color,
    weight: c.interactive ? 2.0 : 1.2,
    opacity: 0.9,
    fillColor: c.color,
    fillOpacity: c.fill,
    interactive: c.interactive
  };
}

// ---------- Parse limits + frequencies ----------
function parseDesc(text = '') {
  const limits = (text.match(/(?:GND|SFC|FL\d+|\d+\s*FT(?:\s*(?:AGL|ALT|AMSL))?)\s*[-–to]+\s*(?:FL\d+|\d+\s*FT(?:\s*(?:AGL|ALT|AMSL))?|UNL)/i) || [])[0] || '';
  const freqLines = [];
  const re = /(?:Freq[:\s]*)?(\d{3}\.\d{1,3}|\d{3})\s*(?:MHz)?(?:\s*\(([^)]+)\))?/gi;
  let m;
  while ((m = re.exec(text)) !== null) {
    const freq = m[1];
    const label = (m[2] || '').trim();
    freqLines.push({ freq, label });
  }
  // de-dupe
  const seen = new Set();
  const unique = freqLines.filter(f => {
    const k = f.freq + f.label;
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return { limits: limits.replace(/\s+/g, ' '), freqs: unique.slice(0, 6) };
}

function airspacePopup(f) {
  const name = f.properties?.name || f.properties?.Name || 'Airspace';
  const desc = f.properties?.description || f.properties?.Description || '';
  const { limits, freqs } = parseDesc(desc);

  let html = `<div class="p-name">${name}</div>`;
  if (limits) html += `<div class="p-limits">${limits}</div>`;
  if (freqs.length) {
    html += `<div class="p-freq">`;
    freqs.forEach(fr => {
      const lbl = fr.label ? fr.label : 'Freq';
      html += `<div><span>${lbl}</span>${fr.freq} MHz</div>`;
    });
    html += `</div>`;
  }
  return html;
}

function airportPopup(icao, desc = '') {
  const { freqs } = parseDesc(desc);
  let html = `<div class="p-name">${icao}</div>`;
  if (freqs.length) {
    html += `<div class="p-freq">`;
    freqs.forEach(fr => {
      // try to guess role from label
      let role = fr.label || 'Frequency';
      if (!fr.label) {
        // fallback guess
        role = 'Tower';
      }
      html += `<div><span>${role}</span>${fr.freq} MHz</div>`;
    });
    html += `</div>`;
  } else {
    html += `<div class="p-freq" style="color:var(--muted)">No frequency data in KMZ</div>`;
  }
  return html;
}

// ---------- Hard-coded airports (positions) ----------
const AIRPORTS = [
  ['FAAB',-28.57331,16.53433],['FABB',-26.24289,28.30078],['FABE',-32.89722,27.27917],
  ['FABL',-29.09673,26.30064],['FABM',-28.24861,28.33611],['FABW',-32.20833,22.93889],
  ['FACF',-34.18774,24.83051],['FACO',-29.93320,22.26574],['FACT',-33.97137,18.60429],
  ['FAEL',-33.03560,27.82316],['FAGC',-26.07420,28.13170],['FAGG',-34.00568,22.37596],
  ['FAGM',-26.24250,28.15120],['FAGR',-32.19116,24.53837],['FAGY',-29.11985,30.58722],
  ['FAHG',-26.50500,28.39400],['FAHL',-28.02000,32.28000],['FAHS',-24.35889,31.04750],
  ['FAKM',-28.80478,24.76403],['FAKN',-25.39103,31.09928],['FAKR',-26.08029,27.72452],
  ['FALA',-25.93969,27.92557],['FALE',-29.61177,31.11931],['FALM',-23.15945,29.70150],
  ['FALW',-32.96881,18.16526],['FALY',-28.57991,29.75274],['FAMD',-24.81378,31.54455],
  ['FAMG',-30.85737,30.34303],['FAMM',-25.80745,25.54447],['FAMN',-25.47333,31.56556],
  ['FAMO',-34.15729,22.06194],['FANC',-27.77278,29.97639],['FAOB',-34.55812,20.24856],
  ['FAOH',-33.60000,22.18333],['FAOR',-26.13703,28.24287],['FAPA',-33.55927,26.87797],
  ['FAPE',-33.99001,25.61028],['FAPG',-34.08816,23.32862],['FAPH',-23.93664,31.15510],
  ['FAPI',-23.92694,29.48436],['FAPM',-29.64679,30.39777],['FAPN',-25.33604,27.17163],
  ['FAPP',-23.84965,29.45649],['FAPS',-26.66829,27.08333],['FARB',-28.74114,32.09338],
  ['FASC',-26.52104,29.17222],['FASK',-25.80894,28.16697],['FASS',-27.64995,23.00305],
  ['FASZ',-24.96133,31.58882],['FATF',-28.26667,23.00000],['FATT',-26.78051,29.33909],
  ['FATW',-27.20313,22.48083],['FATZ',-23.83000,30.31667],['FAUL',-28.31947,31.41694],
  ['FAUP',-28.40130,21.25913],['FAUS',-24.78225,31.35417],['FAUT',-31.54645,28.67532],
  ['FAVG',-29.77083,31.06028],['FAVM',-22.44811,29.33778],['FAWB',-25.65531,28.22134],
  ['FAWI',-25.83378,29.19263],['FAWK',-25.82826,28.22275],['FAWN',-33.76972,18.74000],
  ['FAYP',-33.90099,18.49749]
];

// Will be filled from KMZ
const aerodromeDesc = {};

const airportLayer = L.layerGroup();
AIRPORTS.forEach(([id, la, lo]) => {
  const m = L.circleMarker([la, lo], {
    radius: 5,
    color: '#f8fafc',
    weight: 1.5,
    fillColor: '#0ea5e9',
    fillOpacity: 1,
    pane: 'airports'           // ← high z-index pane
  });
  m.bindTooltip(id, {
    permanent: true,
    direction: 'right',
    className: 'ap-label',
    offset: [7, 0]
  });
  m.on('click', () => {
    m.bindPopup(airportPopup(id, aerodromeDesc[id] || ''), { maxWidth: 260 }).openPopup();
  });
  airportLayer.addLayer(m);
});
airportLayer.addTo(map);

// ---------- Load KMZ ----------
async function load() {
  try {
    setStatus('Loading KMZ…');
    const res = await fetch(KMZ);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const zip = await JSZip.loadAsync(await res.blob());

    const kmlName = Object.keys(zip.files).find(f => f.toLowerCase().endsWith('.kml'));
    if (!kmlName) throw new Error('No KML in file');

    setStatus('Parsing…');
    const kml = new DOMParser().parseFromString(await zip.files[kmlName].async('text'), 'text/xml');
    const gj = toGeoJSON.kml(kml);
    const features = gj.features || [];

    // Collect aerodrome descriptions for frequency data
    features.forEach(f => {
      if (f.geometry?.type !== 'Point') return;
      const name = (f.properties?.name || f.properties?.Name || '').toUpperCase().trim();
      if (/^FA[A-Z]{2}$/.test(name)) {
        aerodromeDesc[name] = f.properties?.description || f.properties?.Description || '';
      }
    });

    const polys = features.filter(f => f.geometry && (f.geometry.type === 'Polygon' || f.geometry.type === 'MultiPolygon'));
    const points = features.filter(f => f.geometry?.type === 'Point' && !/^FA[A-Z]{2}$/.test((f.properties?.name || '').toUpperCase()));

    // Sort so higher priority (interactive) are last → on top
    polys.sort((a, b) => classify(a.properties?.name || '').prio - classify(b.properties?.name || '').prio);

    // Layer groups
    const L_fir = L.layerGroup();
    const L_cta = L.layerGroup();
    const L_tma = L.layerGroup();
    const L_ctr = L.layerGroup();
    const L_sra = L.layerGroup();
    const L_rest = L.layerGroup();
    const L_dang = L.layerGroup();
    const L_proh = L.layerGroup();
    const L_other = L.layerGroup();

    polys.forEach(f => {
      const name = f.properties?.name || f.properties?.Name || '';
      const c = classify(name);
      const layer = L.geoJSON(f, {
        style: () => styleFor(f),
        onEachFeature: (feat, lyr) => {
          if (!c.interactive) return; // big FIRs/CTAs never get events
          lyr.bindPopup(airspacePopup(feat), { maxWidth: 280 });
          lyr.on('mouseover', e => {
            e.target.setStyle({ weight: 3.2, fillOpacity: Math.min(0.42, c.fill + 0.14) });
            e.target.bringToFront();
          });
          lyr.on('mouseout', e => e.target.setStyle(styleFor(feat)));
        }
      });

      if (c.type === 'fir') L_fir.addLayer(layer);
      else if (c.type === 'cta') L_cta.addLayer(layer);
      else if (c.type === 'tma') L_tma.addLayer(layer);
      else if (c.type === 'ctr' || c.type === 'atz') L_ctr.addLayer(layer);
      else if (c.type === 'sra') L_sra.addLayer(layer);
      else if (c.type === 'restricted') L_rest.addLayer(layer);
      else if (c.type === 'danger') L_dang.addLayer(layer);
      else if (c.type === 'prohibited') L_proh.addLayer(layer);
      else L_other.addLayer(layer);
    });

    // Waypoints / navaids – high pane, off by default
    const pointLayer = L.geoJSON({ type: 'FeatureCollection', features: points }, {
      pointToLayer: (f, ll) => L.circleMarker(ll, {
        radius: 3.2, color: '#475569', weight: 1,
        fillColor: '#64748b', fillOpacity: 0.85,
        pane: 'points'
      }),
      onEachFeature: (f, lyr) => {
        const name = f.properties?.name || f.properties?.Name || 'Point';
        lyr.bindPopup(`<div class="p-name">${name}</div>`);
      }
    });

    // Default on
    L_fir.addTo(map);
    L_cta.addTo(map);
    L_tma.addTo(map);
    L_ctr.addTo(map);
    L_sra.addTo(map);
    L_rest.addTo(map);
    L_dang.addTo(map);
    L_proh.addTo(map);

    const overlays = {
      'FIRs (pass-through)': L_fir,
      'CTAs / ACC / FIS': L_cta,
      'TMAs': L_tma,
      'CTRs & ATZs': L_ctr,
      'Special Rules': L_sra,
      'Restricted': L_rest,
      'Danger': L_dang,
      'Prohibited': L_proh,
      'Other': L_other,
      'Airports': airportLayer,
      'Waypoints / Navaids': pointLayer
    };

    L.control.layers(baseLayers, overlays, {
      collapsed: false,
      position: 'topright'
    }).addTo(map);

    setStatus('Ready', var(--green));
    setTimeout(() => statusEl.style.opacity = '0', 2800);
  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message, '#f87171');
  }
}

load();

// Legend
document.getElementById('legend').innerHTML = `
  <div class="title">AIRSPACE</div>
  <div><b style="background:#64748b"></b>FIR (click-through)</div>
  <div><b style="background:#6366f1"></b>CTA / ACC</div>
  <div><b style="background:#8b5cf6"></b>TMA</div>
  <div><b style="background:#3b82f6"></b>CTR</div>
  <div><b style="background:#06b6d4"></b>ATZ</div>
  <div><b style="background:#a855f7"></b>SRA</div>
  <div><b style="background:#dc2626"></b>Restricted</div>
  <div><b style="background:#d97706"></b>Danger</div>
  <div><b style="background:#b91c1c"></b>Prohibited</div>
  <div style="margin-top:7px"><b style="background:#0ea5e9;border-radius:50%"></b>Airport</div>
`;
</script>
</body>
</html>
